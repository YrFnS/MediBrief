
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>MediBrief - Clinical Intelligence Layer</title>
  <link rel="manifest" href="/manifest.json" />
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(
          (registration) => console.log('SW registered: ', registration.scope),
          (err) => console.log('SW registration failed: ', err)
        );
      });
    }
  </script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
            display: ['Space Grotesk', 'sans-serif'],
          },
          colors: {
            medical: {
              50: '#F0F4F8',
              100: '#D9E2EC',
              200: '#BCCCDC',
              300: '#9FB3C8',
              400: '#829AB1',
              500: '#627D98', // Slate Blue
              600: '#486581',
              700: '#334E68',
              800: '#243B53',
              900: '#102A43',
            },
            alert: {
               500: '#EF4444',
               900: '#7F1D1D'
            },
            surface: {
               light: '#FFFFFF',
               dark: '#0B0F19' // Deep specialized dark
            }
          },
          backgroundImage: {
            'grid-pattern': "linear-gradient(to right, rgba(98, 125, 152, 0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(98, 125, 152, 0.05) 1px, transparent 1px)",
            'grid-pattern-dark': "linear-gradient(to right, rgba(148, 163, 184, 0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(148, 163, 184, 0.05) 1px, transparent 1px)",
          },
          backgroundSize: {
            'grid': '24px 24px'
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'fade-in': 'fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'scan': 'scan 2s linear infinite',
            'soft-stream': 'softStream 0.3s ease-out forwards',
            'music': 'music 1s ease-in-out infinite',
            'spin-slow': 'spin 3s linear infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { transform: 'translateY(20px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            scan: {
               '0%': { transform: 'translateY(-100%)' },
               '100%': { transform: 'translateY(100%)' }
            },
            softStream: {
              '0%': { opacity: '0.4', transform: 'translateY(2px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            music: {
              '0%, 100%': { height: '20%' },
              '50%': { height: '100%' }
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    
    .technical-border {
      position: relative;
    }
    .technical-border::before {
      content: '';
      position: absolute;
      top: -1px; left: -1px; width: 8px; height: 8px;
      border-top: 2px solid currentColor;
      border-left: 2px solid currentColor;
      opacity: 0.8;
      pointer-events: none;
    }
    .technical-border::after {
      content: '';
      position: absolute;
      bottom: -1px; right: -1px; width: 8px; height: 8px;
      border-bottom: 2px solid currentColor;
      border-right: 2px solid currentColor;
      opacity: 0.8;
      pointer-events: none;
    }
    
    .scanline {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.02) 50%, rgba(0,0,0,0.02));
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 9999;
    }

    /* Clinical Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 2px;
    }
    .dark ::-webkit-scrollbar-thumb { background: #334155; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }

    /* Animation Delays */
    .animation-delay-100 { animation-delay: 100ms; }
    .animation-delay-200 { animation-delay: 200ms; }
    .animation-delay-300 { animation-delay: 300ms; }
    .animation-delay-400 { animation-delay: 400ms; }
    .animation-delay-500 { animation-delay: 500ms; }
  </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.1",
    "react-dom/client": "https://aistudiocdn.com/react-dom@^19.2.0/client",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "jspdf": "https://esm.sh/jspdf@2.5.2?exports=jsPDF",
    "dompurify": "https://esm.sh/dompurify@3.0.6",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "marked": "https://aistudiocdn.com/marked@^17.0.0",
    "uuid": "https://esm.sh/uuid@^13.0.0",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom"
  }
}
</script>
</head>
<body class="bg-slate-50 dark:bg-surface-dark text-slate-800 dark:text-slate-200 antialiased selection:bg-blue-500/30 selection:text-blue-200 bg-grid-pattern dark:bg-grid-pattern-dark bg-grid fixed inset-0 overflow-hidden">
  <div class="scanline"></div>
  <div id="root" class="h-full w-full"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
