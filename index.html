
<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <title>MediBrief - Clinical Intelligence Layer</title>
  <link rel="manifest" href="/manifest.json" />
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(
          (registration) => console.log('SW registered: ', registration.scope),
          (err) => console.log('SW registration failed: ', err)
        );
      });
    }
  </script>
  <script>
    tailwind.config = {
      darkMode: 'class', // Manual toggle, defaulting to light
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
            display: ['Space Grotesk', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#F0F9FF',
              100: '#E0F2FE',
              500: '#0EA5E9',
              600: '#0284C7',
              900: '#0C4A6E',
            },
            slate: {
              50: '#F8FAFC',
              100: '#F1F5F9',
              200: '#E2E8F0',
              300: '#CBD5E1',
              400: '#94A3B8',
              500: '#64748B',
              600: '#475569',
              700: '#334155',
              800: '#1E293B',
              900: '#0F172A',
            }
          },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
            'float': '0 10px 40px -10px rgba(0, 0, 0, 0.08)',
          },
          animation: {
            'fade-in': 'fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'breathe': 'breathe 6s ease-in-out infinite',
            'music': 'music 1s ease-in-out infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { transform: 'translateY(10px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            breathe: {
              '0%, 100%': { transform: 'scale(1)', opacity: '0.3' },
              '50%': { transform: 'scale(1.05)', opacity: '0.5' },
            },
            music: {
              '0%, 100%': { height: '20%' },
              '50%': { height: '100%' }
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F8FAFC; /* Slate-50 */
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
    }
    
    /* Clean scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
    
    .no-scrollbar::-webkit-scrollbar {
        display: none;
    }
    .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }

    /* Technical Grid Pattern for "Medical OS" feel */
    .bg-grid-pattern {
        background-size: 40px 40px;
        background-image: 
            linear-gradient(to right, rgba(148, 163, 184, 0.1) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(148, 163, 184, 0.1) 1px, transparent 1px);
    }
    
    .dark .bg-grid-pattern {
        background-image: 
            linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    }

    /* Custom Scrollbar for Terminals/Logs */
    .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.05);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #94a3b8;
        border-radius: 2px;
    }

    /* Technical Borders - Restored */
    .technical-border {
      position: relative;
    }
    .technical-border::before {
      content: '';
      position: absolute;
      top: -1px; left: -1px;
      width: 10px; height: 10px;
      border-top: 2px solid #3b82f6;
      border-left: 2px solid #3b82f6;
      pointer-events: none;
    }
    .technical-border::after {
      content: '';
      position: absolute;
      bottom: -1px; right: -1px;
      width: 10px; height: 10px;
      border-bottom: 2px solid #3b82f6;
      border-right: 2px solid #3b82f6;
      pointer-events: none;
    }
    
    /* Utility for masking */
    .mask-fade-b {
        mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
    }
    
    .mask-fade-r {
        mask-image: linear-gradient(to right, black 90%, transparent 100%);
        -webkit-mask-image: linear-gradient(to right, black 90%, transparent 100%);
    }
  </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react": "https://esm.sh/react@18.3.1",
    "jspdf": "https://esm.sh/jspdf@2.5.2?exports=jsPDF",
    "dompurify": "https://esm.sh/dompurify@3.0.6",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "react/": "https://esm.sh/react@18.3.1/",
    "marked": "https://aistudiocdn.com/marked@^17.0.0",
    "uuid": "https://esm.sh/uuid@^13.0.0",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom",
    "zustand": "https://esm.sh/zustand@4.5.2",
    "zustand/middleware": "https://esm.sh/zustand@4.5.2/middleware",
    "zustand/": "https://esm.sh/zustand@^5.0.10/",
    "zod": "https://esm.sh/zod@3.22.4",
    "idb-keyval": "https://esm.sh/idb-keyval@6.2.1"
  }
}
</script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-blue-100 selection:text-blue-900 fixed inset-0 overflow-hidden">
  <div id="root" class="h-full w-full relative z-10"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
