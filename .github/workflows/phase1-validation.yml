name: MediBrief Clinical Validation

on:
  pull_request:
    branches:
      - main
      - agent/phase-1-clinical-foundation
      - agent/phase-2-personal-health-record
  push:
    branches:
      - agent/phase-1-clinical-foundation
      - agent/phase-2-personal-health-record
      - agent/phase-3-openmed-extraction

permissions:
  contents: read

jobs:
  validate:
    name: Type-check, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OpenMed bridge test dependencies
        run: python -m pip install --disable-pip-version-check "openmed[service]==2.0.0" pytest

      - name: Test OpenMed context bridge
        run: python -m pytest -q openmed_bridge/tests

      - name: Evaluate synthetic English context corpus
        run: python -m openmed_bridge.evaluate_context --minimum-axis-accuracy 1 --minimum-exact-case-accuracy 1 --minimum-medication-sig-accuracy 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Run automated tests
        run: npm run test:run

      - name: Build production application
        run: npm run build:app
