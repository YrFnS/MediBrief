name: Apply Phase 5 Trend Reminder Wording Fix

on:
  push:
    branches:
      - agent/phase-5-grounded-assistance
    paths:
      - .github/workflows/apply-phase5-trend-reminder-wording-fix.yml

permissions:
  contents: write

jobs:
  apply:
    name: Patch reminder wording and remove temporary workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Phase 5 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-5-grounded-assistance
          fetch-depth: 0

      - name: Apply focused source fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('features/trend-reminders/reminders.ts')
          text = path.read_text(encoding='utf-8')
          unused = """const OPEN_TASK_STATUSES = new Set<ClinicalTaskRecord['status']>([
              'draft',
              'requested',
              'received',
              'accepted',
              'in-progress',
          ]);
          """
          old = "It is not an order, prescription, booking, notification delivery, treatment instruction, or proof that any external action occurred."
          new = "It does not send a notification, place an order or prescription, book anything, deliver a treatment instruction, or prove that any external action occurred."
          if unused not in text:
              raise SystemExit('Expected unused task-status block was not found.')
          if old not in text:
              raise SystemExit('Expected reminder task boundary wording was not found.')
          text = text.replace(unused, '', 1).replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: git rm .github/workflows/apply-phase5-trend-reminder-wording-fix.yml

      - name: Commit and push focused fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/trend-reminders/reminders.ts
          git commit -m "fix: clarify reminder task notification boundary"
          git push origin HEAD:agent/phase-5-grounded-assistance
