name: Apply Phase 5 Trend Reminder Final Wording Fix

on:
  push:
    branches:
      - agent/phase-5-grounded-assistance
    paths:
      - .github/workflows/apply-phase5-trend-reminder-final-wording-fix.yml

permissions:
  contents: write

jobs:
  apply:
    name: Patch final reminder wording and remove temporary workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Phase 5 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-5-grounded-assistance
          fetch-depth: 0

      - name: Apply focused source fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          reminders_path = Path('features/trend-reminders/reminders.ts')
          reminders = reminders_path.read_text(encoding='utf-8')
          old_reminder = "It does not send a notification, place an order or prescription, book anything, deliver a treatment instruction, or prove that any external action occurred."
          new_reminder = "It does not send a notification or book anything. It is not an order, prescription, treatment instruction, or proof that any external action occurred."
          if old_reminder not in reminders:
              raise SystemExit('Expected reminder task boundary wording was not found.')
          reminders_path.write_text(
              reminders.replace(old_reminder, new_reminder, 1),
              encoding='utf-8',
          )

          workspace_path = Path('features/trend-reminders/components/TrendAndReminderWorkspace.tsx')
          workspace = workspace_path.read_text(encoding='utf-8')
          old_workspace = "The task is a routine local proposal. It does not send a notification, contact a clinic, place an order, or instruct medication changes."
          new_workspace = "The task is a routine local proposal. It does not send notifications, contact a clinic, place an order, or instruct medication changes."
          if old_workspace not in workspace:
              raise SystemExit('Expected reminder workspace wording was not found.')
          workspace_path.write_text(
              workspace.replace(old_workspace, new_workspace, 1),
              encoding='utf-8',
          )
          PY

      - name: Remove temporary workflow
        run: git rm .github/workflows/apply-phase5-trend-reminder-final-wording-fix.yml

      - name: Commit and push focused fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/trend-reminders/reminders.ts features/trend-reminders/components/TrendAndReminderWorkspace.tsx
          git commit -m "fix: clarify reminder task action boundaries"
          git push origin HEAD:agent/phase-5-grounded-assistance
