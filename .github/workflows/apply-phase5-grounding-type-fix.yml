name: Apply Phase 5 Grounding Type Fix

on:
  push:
    branches:
      - agent/phase-5-grounded-assistance
    paths:
      - .github/workflows/apply-phase5-grounding-type-fix.yml

permissions:
  contents: write

jobs:
  apply:
    name: Patch, validate, and publish grounding fix
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Phase 5 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-5-grounded-assistance
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch exhaustive switch fallbacks
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('features/grounded-assistance/grounding.ts')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  """        default:
                      return resource.resourceType;
          """,
                  """        default:
                      return 'Clinical record';
          """,
              ),
              (
                  """        default:
                      return `${resource.resourceType} record ${resource.id}`;
          """,
                  """        default:
                      return 'Clinical record evidence';
          """,
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one grounding fallback match: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/apply-phase5-grounding-type-fix.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Run automated tests
        run: npm run test:run

      - name: Build production application
        run: npm run build:app

      - name: Commit and push validated fix
        run: |
          git config user.name "MediBrief automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No fix produced."; exit 1; }
          git commit -m "fix: complete grounded evidence switch handling"
          git push origin HEAD:agent/phase-5-grounded-assistance
