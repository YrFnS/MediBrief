name: One-time malformed SVG icon repair

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-fix-malformed-icons.yml'

permissions:
  contents: write

jobs:
  repair-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair the two malformed SVG path definitions
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('components/icons.tsx')
          source = path.read_text(encoding='utf-8')

          users_path = (
              '<path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5'
              'c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 '
              '2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 '
              '0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 '
              '0-.62.02-.97.05c1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5'
              'c0-2.33-4.67-3.5-7-3.5z"/>'
          )
          clock_path = (
              '<path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10'
              'C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 '
              '0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/>'
          )

          source, users_count = re.subn(
              r'<path d="[^"\n]*3\.45V19[^"\n]*"\s*/>',
              users_path,
              source,
              count=1,
          )
          source, clock_count = re.subn(
              r'<path d="[^"\n]*3\.58 8 8-8 8z"\s*/>',
              clock_path,
              source,
              count=1,
          )

          if users_count != 1 or clock_count != 1:
              raise SystemExit(
                  f'Expected one Users and one Clock repair; got '
                  f'Users={users_count}, Clock={clock_count}'
              )

          path.write_text(source, encoding='utf-8')
          PY

          git diff --check
          git diff -- components/icons.tsx

      - name: Commit repaired icons directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MediBrief browser repair'
          git config user.email 'actions@users.noreply.github.com'
          git add components/icons.tsx
          git commit -m 'fix: repair malformed SVG icon paths'
          git push origin HEAD:main
