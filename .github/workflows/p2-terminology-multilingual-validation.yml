name: P2 Terminology and Multilingual Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
      - 'agent/p2-terminology-multilingual-validation'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2-terminology-multilingual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-p2:
    name: Terminology governance and multilingual document contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install evaluator test dependency
        run: python -m pip install pytest==8.4.1

      - name: Test multilingual evaluator contracts
        run: python -m pytest openmed_bridge/tests/test_evaluate_multilingual_documents.py -q

      - name: Evaluate PHI-free multilingual document contract
        run: >-
          python -m openmed_bridge.evaluate_multilingual_documents
          --gold evaluation/p2/multilingual_clinical_documents_gold.json
          --predictions evaluation/p2/multilingual_contract_predictions.json
          --require-contract-fixture
          --output p2-evidence/multilingual-document-report.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install application dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check application
        run: npm run typecheck

      - name: Run terminology governance tests
        run: npx vitest run tests/terminologyGovernance.test.ts

      - name: Build production application
        run: npm run build:app

      - name: Upload PHI-free P2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-terminology-multilingual-evidence
          path: |
            p2-evidence/multilingual-document-report.json
            evaluation/p2/multilingual_clinical_documents_gold.json
            evaluation/p2/multilingual_contract_predictions.json
          if-no-files-found: ignore
          retention-days: 14
