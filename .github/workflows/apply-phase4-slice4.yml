name: Apply Phase 4 Slice 4

on:
  push:
    branches:
      - agent/phase-4-diagnostic-report-pipeline
    paths:
      - scripts/apply_phase4_slice4.py
      - .github/workflows/apply-phase4-slice4.yml

permissions:
  contents: write

jobs:
  apply:
    name: Apply, validate, and publish Slice 4
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Phase 4 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-4-diagnostic-report-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Slice 4 patch
        run: python scripts/apply_phase4_slice4.py

      - name: Remove temporary patch machinery
        run: rm scripts/apply_phase4_slice4.py .github/workflows/apply-phase4-slice4.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Run automated tests
        run: npm run test:run

      - name: Build production application
        run: npm run build:app

      - name: Commit and push validated Slice 4
        run: |
          git config user.name "MediBrief automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No implementation changes were produced."; exit 1; }
          git commit -m "feat: add diagnostic corrections and conflict resolution"
          git push origin HEAD:agent/phase-4-diagnostic-report-pipeline
