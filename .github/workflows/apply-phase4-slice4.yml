name: Apply Phase 4 Slice 4

on:
  pull_request:
    branches:
      - agent/phase-3-openmed-extraction
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - scripts/apply_phase4_slice4.py
      - .github/workflows/apply-phase4-slice4.yml

permissions:
  contents: write

jobs:
  apply:
    name: Apply, validate, and publish Slice 4
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Phase 4 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-4-diagnostic-report-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Repair staged patch script syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply_phase4_slice4.py')
          text = path.read_text(encoding='utf-8')
          needle = """    \"\"\"import { validateDiagnosticReportBundleGraph } from '../graph';
          \"\"\",
              \"\"\",
          )
          """
          replacement = """    \"\"\"import { validateDiagnosticReportBundleGraph } from '../graph';
          \"\"\",
              \"\",
          )
          """
          if text.count(needle) != 1:
              raise SystemExit('Could not find the staged empty-string syntax defect exactly once.')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Apply and validate Slice 4
        id: validate
        shell: bash
        run: |
          set +e
          log=/tmp/phase4-slice4-validation.log
          : > "$log"

          run_step() {
            label="$1"
            shift
            {
              echo
              echo "===== $label ====="
              "$@"
            } >> "$log" 2>&1
            return $?
          }

          run_step "Apply patch" python scripts/apply_phase4_slice4.py
          exit_code=$?

          if [ "$exit_code" -eq 0 ]; then
            python - <<'PY' >> "$log" 2>&1
          from pathlib import Path

          path = Path('tests/diagnosticReportReviewWorkspace.test.ts')
          text = path.read_text(encoding='utf-8')
          old = "expect(workspace).toContain('validateDiagnosticReportBundleGraph');"
          new = "expect(workspace).toContain('validateConflictAwareDiagnosticReportBundle');"
          if text.count(old) != 1:
              raise SystemExit('Expected the legacy review-workspace validator contract exactly once.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
            exit_code=$?
          fi

          if [ "$exit_code" -eq 0 ]; then
            rm -f \
              scripts/apply_phase4_slice4.py \
              scripts/phase4_slice4_failure.log \
              .github/workflows/apply-phase4-slice4.yml
            run_step "Install dependencies" npm install --no-audit --no-fund
            exit_code=$?
          fi
          if [ "$exit_code" -eq 0 ]; then
            run_step "Type-check" npm run typecheck
            exit_code=$?
          fi
          if [ "$exit_code" -eq 0 ]; then
            run_step "Automated tests" npm run test:run
            exit_code=$?
          fi
          if [ "$exit_code" -eq 0 ]; then
            run_step "Production build" npm run build:app
            exit_code=$?
          fi

          cat "$log"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish failure diagnostics only
        if: steps.validate.outputs.exit_code != '0'
        shell: bash
        run: |
          git fetch origin agent/phase-4-diagnostic-report-pipeline
          git reset --hard origin/agent/phase-4-diagnostic-report-pipeline
          cp /tmp/phase4-slice4-validation.log scripts/phase4_slice4_failure.log
          git config user.name "MediBrief automation"
          git config user.email "actions@users.noreply.github.com"
          git add -f scripts/phase4_slice4_failure.log
          git commit -m "chore: record phase 4 slice 4 validation failure"
          git push origin HEAD:agent/phase-4-diagnostic-report-pipeline
          exit 1

      - name: Commit and push validated Slice 4
        if: steps.validate.outputs.exit_code == '0'
        shell: bash
        run: |
          git config user.name "MediBrief automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No implementation changes were produced."; exit 1; }
          git commit -m "feat: add diagnostic corrections and conflict resolution"
          git push origin HEAD:agent/phase-4-diagnostic-report-pipeline
