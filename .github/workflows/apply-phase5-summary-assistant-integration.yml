name: Apply Phase 5 Summary and Assistant Integration

on:
  push:
    branches:
      - agent/phase-5-grounded-assistance
    paths:
      - .github/workflows/apply-phase5-summary-assistant-integration.yml

permissions:
  contents: write

jobs:
  apply:
    name: Patch, validate, and publish grounded Assistant integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Phase 5 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-5-grounded-assistance
          fetch-depth: 0

      - name: Apply integration patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'Expected exactly one match in {path}, found {count}: {old[:120]!r}'
                  )
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          orchestrator = 'features/chat/hooks/useChatOrchestrator.ts'
          replace_once(
              orchestrator,
              """import { useAuditStore } from '../../audit/useAuditStore';
          import { createPendingLegacyLabReview } from '../../diagnostic-reports';
          """,
              """import { useAuditStore } from '../../audit/useAuditStore';
          import { useClinicalRecordStore } from '../../clinical-record/useClinicalRecordStore';
          import { createPendingLegacyLabReview } from '../../diagnostic-reports';
          import {
              finalizeGroundedAssistantAnswer,
              prepareAssistantTurn,
          } from '../../grounded-assistance';
          """,
          )
          replace_once(
              orchestrator,
              """    const auditActions = useAuditStore(state => state.actions);
              const {
          """,
              """    const auditActions = useAuditStore(state => state.actions);
              const activeRecord = useClinicalRecordStore(
                  state => state.records[activePatientId],
              );
              const {
          """,
          )
          replace_once(
              orchestrator,
              """        if (trimmedPrompt.toLowerCase() === '/help') {
                  addMessage(activePatientId, { role: 'user', content: '/help' });
                  addMessage(activePatientId, {
                      role: 'model',
                      content: HELP_COMMAND_RESPONSE,
                  });
                  return;
              }

              let finalApiPrompt = trimmedPrompt;
          """,
              """        if (trimmedPrompt.toLowerCase() === '/help') {
                  addMessage(activePatientId, { role: 'user', content: '/help' });
                  addMessage(activePatientId, {
                      role: 'model',
                      content: HELP_COMMAND_RESPONSE,
                  });
                  return;
              }

              const preparedTurn = uploadedFile
                  ? ({ kind: 'general' } as const)
                  : prepareAssistantTurn(activeRecord, trimmedPrompt);

              if (preparedTurn.kind === 'deterministic-summary') {
                  addMessage(activePatientId, {
                      role: 'user',
                      content: trimmedPrompt,
                  });
                  addMessage(activePatientId, {
                      role: 'model',
                      content: preparedTurn.response,
                  });
                  auditActions.logEvent(
                      'DETERMINISTIC_SUMMARY_GENERATED',
                      activePatientId,
                      'Generated a deterministic summary from confirmed patient-record evidence.',
                      'SYSTEM',
                      {
                          selectedEvidence: preparedTurn.summary.evidenceBundle.selection.selected,
                          pendingCandidates: preparedTurn.summary.pendingCandidateCount,
                          diagnosticConflicts: preparedTurn.summary.diagnosticConflictCount,
                      },
                  );
                  return;
              }

              if (
                  preparedTurn.kind === 'patient-record'
                  && preparedTurn.immediateResponse
              ) {
                  addMessage(activePatientId, {
                      role: 'user',
                      content: trimmedPrompt,
                  });
                  addMessage(activePatientId, {
                      role: 'model',
                      content: preparedTurn.immediateResponse,
                  });
                  auditActions.logEvent(
                      'GROUNDED_ASSISTANT_REJECTED',
                      activePatientId,
                      'Patient-record request ended without a model call because confirmed evidence was unavailable.',
                      'SYSTEM',
                      {
                          selectedEvidence: preparedTurn.bundle.selection.selected,
                          includeHistory: preparedTurn.includeHistory,
                          resourceTypes: preparedTurn.resourceTypes,
                          reason: 'no-confirmed-evidence',
                      },
                  );
                  return;
              }

              const groundedTurn = preparedTurn.kind === 'patient-record'
                  ? preparedTurn
                  : undefined;

              let finalApiPrompt = trimmedPrompt;
          """,
          )
          replace_once(
              orchestrator,
              """        } else if (isBriefingCommand) {
          """,
              """        } else if (isBriefingCommand && !groundedTurn) {
          """,
          )
          replace_once(
              orchestrator,
              """        } else if (isDrugCommand) {
          """,
              """        } else if (isDrugCommand && !groundedTurn) {
          """,
          )
          replace_once(
              orchestrator,
              """        if (trimmedPrompt.toLowerCase().startsWith('/patient')) {
                  modeForRequest = ChatModeEnum.Standard;
              }

              const userMessage: ChatMessage = {
          """,
              """        if (trimmedPrompt.toLowerCase().startsWith('/patient')) {
                  modeForRequest = ChatModeEnum.Standard;
              }

              if (groundedTurn?.modelPrompt) {
                  finalApiPrompt = groundedTurn.modelPrompt;
                  responseType = 'text';
                  fileForApi = undefined;
                  auditActions.logEvent(
                      'GROUNDING_BUNDLE_GENERATED',
                      activePatientId,
                      'Selected confirmed patient-record evidence for a grounded Assistant request.',
                      'SYSTEM',
                      {
                          selectedEvidence: groundedTurn.bundle.selection.selected,
                          eligibleBeforeSelection:
                              groundedTurn.bundle.selection.eligibleBeforeSelection,
                          excludedCounts: groundedTurn.bundle.excludedCounts,
                          includeHistory: groundedTurn.includeHistory,
                          resourceTypes: groundedTurn.resourceTypes,
                      },
                  );
              }

              const userMessage: ChatMessage = {
          """,
          )
          replace_once(
              orchestrator,
              """            const history = [...messages];
          """,
              """            const history = groundedTurn ? [] : [...messages];
          """,
          )
          replace_once(
              orchestrator,
              """                appendToLastMessage(activePatientId, textChunk, sources);
              }
          """,
              """                if (!groundedTurn) {
                      appendToLastMessage(activePatientId, textChunk, sources);
                  }
              }

              if (groundedTurn) {
                  const finalized = finalizeGroundedAssistantAnswer(
                      fullResponseBuffer,
                      groundedTurn.bundle,
                  );
                  updateLastMessageContent(
                      activePatientId,
                      finalized.displayText,
                  );
                  auditActions.logEvent(
                      finalized.accepted
                          ? 'GROUNDED_ASSISTANT_COMPLETED'
                          : 'GROUNDED_ASSISTANT_REJECTED',
                      activePatientId,
                      finalized.accepted
                          ? 'Completed a citation-checked grounded Assistant response.'
                          : 'Withheld a patient-specific model response that failed local citation validation.',
                      'AI',
                      {
                          status: finalized.status,
                          citedEvidenceCount: finalized.citedEvidenceCount,
                          referencedEvidenceIds:
                              finalized.assessment?.referencedEvidenceIds || [],
                          unknownEvidenceIds:
                              finalized.assessment?.unknownEvidenceIds || [],
                      },
                  );
              }
          """,
          )
          replace_once(
              orchestrator,
              """                updateLastMessageContent(
                      activePatientId,
                      `Sorry, I encountered an error.\\n\\n**Details:** ${getFriendlyErrorMessage(error)}`,
                  );
              }
          """,
              """                updateLastMessageContent(
                      activePatientId,
                      `Sorry, I encountered an error.\\n\\n**Details:** ${getFriendlyErrorMessage(error)}`,
                  );
                  if (groundedTurn) {
                      auditActions.logEvent(
                          'GROUNDED_ASSISTANT_REJECTED',
                          activePatientId,
                          'Grounded Assistant generation failed before citation validation.',
                          'AI',
                          {
                              reason: 'provider-or-stream-error',
                              selectedEvidence:
                                  groundedTurn.bundle.selection.selected,
                              error: getFriendlyErrorMessage(error),
                          },
                      );
                  }
              }
          """,
          )
          replace_once(
              orchestrator,
              """            if (activePatientId && isLabReport(fullResponseBuffer)) {
          """,
              """            if (
                  !groundedTurn
                  && activePatientId
                  && isLabReport(fullResponseBuffer)
              ) {
          """,
          )
          replace_once(
              orchestrator,
              """    }, [
              activePatientId,
          """,
              """    }, [
              activePatientId,
              activeRecord,
          """,
          )

          replace_once(
              'features/layout/Phase2Workspace.tsx',
              """                            <AssistantAccessPrompt
                                  onOpenSettings={() => setIsSettingsOpen(true)}
                              />
          """,
              """                            <AssistantAccessPrompt
                                  onOpenSettings={() => setIsSettingsOpen(true)}
                                  record={activeRecord}
                              />
          """,
          )

          replace_once(
              'constants.ts',
              """**Core functions:**
          - `/brief` - Create a reviewable summary from the available record context.
          - `/patient [ID]` - Summarize the selected patient context.
          - `/drugs [names]` - Retrieve an evidence-linked interaction summary. This is not a regimen-safety verdict.
          - `/export` - Export the current briefing to PDF.
          - `/help` - Show this reference.
          """,
              """**Core functions:**
          - `/summary` or `/brief` - Generate a deterministic confirmed-record summary locally without an AI call.
          - `/patient` or `/record` - Generate the same summary for the currently selected patient; typed IDs never switch records.
          - Patient-record questions use a fresh confirmed-evidence bundle and require local `MB:` citations before display.
          - `/drugs [names]` - Retrieve limited medication information. This is not a regimen-safety verdict.
          - `/export` - Export the current chat briefing to PDF.
          - `/help` - Show this reference.
          """,
          )
          PY

      - name: Remove temporary integration workflow
        run: rm .github/workflows/apply-phase5-summary-assistant-integration.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test OpenMed bridge
        run: |
          python -m pip install --disable-pip-version-check "openmed[service]==2.0.0" pytest
          python -m pytest -q openmed_bridge/tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Run automated tests
        run: npm run test:run

      - name: Build production application
        run: npm run build:app

      - name: Commit and push validated integration
        run: |
          git config user.name "MediBrief automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No integration changes produced."; exit 1; }
          git commit -m "feat: integrate deterministic summaries and grounded assistant"
          git push origin HEAD:agent/phase-5-grounded-assistance
